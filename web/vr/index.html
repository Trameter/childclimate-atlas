<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#181E2D" />
  <title>VR Atlas · ChildClimate Risk Atlas — Trameter</title>
  <meta name="description" content="Walk around a tabletop globe of every school and clinic in three countries, scored 0–100 for climate risk. WebXR immersive experience." />
  <meta name="google" content="notranslate" />

  <meta property="og:title" content="ChildClimate Atlas — VR" />
  <meta property="og:description" content="62,817 schools and clinics, in your room, scored for climate risk. Open on a Quest browser to enter VR." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://climate-atlas.trameter.com/vr" />
  <meta property="og:image" content="https://climate-atlas.trameter.com/docs/atlas-3d-screenshot.jpg" />

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/assets/style.css?v=1779417377" />
  <link rel="stylesheet" href="/vr/vr.css?v=1779417377" />
</head>
<body class="is-vr">

  <!-- Topbar -->
  <header class="topbar">
    <a class="brand" href="/" aria-label="ChildClimate Atlas home">
      <svg class="logo-mark" width="28" height="28" viewBox="0 0 76 76" aria-hidden="true">
        <circle cx="38" cy="38" r="34" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="38" cy="22" r="5.5" fill="var(--ember)"/>
      </svg>
      <span class="wm"><b>ChildClimate</b> <span>Atlas</span></span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="/">Atlas</a>
      <a href="/about">About</a>
      <a href="/vr" class="active">VR</a>
    </nav>
    <div class="right">
      <div class="view-toggle" role="tablist" aria-label="Map view">
        <a href="/" class="vt-btn" title="Working data view — 2D map">2D</a>
        <a href="/3d" class="vt-btn" title="Immersive view — 3D globe">3D</a>
        <a href="/vr" class="vt-btn active" aria-current="page" title="VR — WebXR immersive">VR</a>
      </div>
      <a class="btn" href="https://github.com/Trameter/childclimate-atlas" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>

  <!-- VR canvas + UI overlay -->
  <main class="vr-wrap">
    <canvas id="vr-canvas"></canvas>

    <!-- Bottom-center HUD: status + Enter VR button -->
    <div class="vr-hud" id="vr-hud">
      <div class="vr-status" id="vr-status">
        <span class="vr-status-dot"></span>
        <span class="vr-status-text">Loading the atlas…</span>
      </div>
      <div class="vr-enter-row">
        <button type="button" class="vr-enter-btn vr-tour-btn" id="vr-tour-btn" title="Auto-tour the worst facilities across all three countries (90s)">
          <span class="vr-enter-icon" aria-hidden="true">▶</span>
          <span class="vr-enter-label">Spotlight tour</span>
        </button>
        <button type="button" class="vr-enter-btn" id="vr-enter-btn" disabled>
          <span class="vr-enter-icon" aria-hidden="true">⌐</span>
          <span class="vr-enter-label">Enter VR</span>
        </button>
        <button type="button" class="vr-enter-btn vr-ar-btn" id="vr-ar-btn" disabled>
          <span class="vr-enter-icon" aria-hidden="true">◇</span>
          <span class="vr-enter-label">Enter AR</span>
        </button>
      </div>
    </div>

    <!-- Country labels float over the visible hemisphere via DOM overlay.
         Positions updated per frame from screen-projected 3D vectors.
         Sibling of .vr-hud so it can cover the full viewport. -->
    <div id="vr-country-labels" aria-hidden="true"></div>

    <!-- Top-left HUD: country picker + summary -->
    <div class="vr-meta" id="vr-meta">
      <div class="vr-country-row">
        <button class="vr-country" data-iso="NGA">Nigeria</button>
        <button class="vr-country active" data-iso="BGD">Bangladesh</button>
        <button class="vr-country" data-iso="GTM">Guatemala</button>
      </div>
      <div class="vr-meta-line mono" id="vr-meta-line">— facilities · severe count —</div>
      <button type="button" class="vr-audio-btn" id="vr-audio-btn" title="Toggle ambient drone (swells when severe-band beacons are in view)">
        <span class="vr-audio-icon" aria-hidden="true">♪</span>
        <span class="vr-audio-label">Sound off</span>
      </button>
    </div>

    <!-- Bottom-right: short instructions for desktop preview -->
    <div class="vr-instructions" id="vr-instructions">
      <strong>Preview controls</strong>
      <span>· drag to orbit the globe</span>
      <span>· scroll to zoom</span>
      <span>· click a beacon for its score</span>
    </div>

    <!-- Beacon detail bubble (shown on click in non-VR preview) -->
    <div class="vr-detail" id="vr-detail" hidden>
      <button type="button" class="vr-detail-close" id="vr-detail-close" aria-label="Close">×</button>
      <div class="vr-detail-body" id="vr-detail-body"></div>
    </div>
  </main>

  <script src="/assets/vendor/three@0.149.0/three.min.js?v=1779417377"></script>
  <script src="/vr/borders.js?v=1779417377"></script>
  <script src="/vr/vr.js?v=1779417377"></script>
</body>
</html>
