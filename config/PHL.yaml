# Philippines — country configuration
country:
  iso3: PHL
  iso2: PH
  name: Philippines
  capital: Manila

# Bbox covers the full archipelago: Luzon north tip (Batanes) through
# Mindanao + Sulu. ~7,640 islands; the bbox is over-inclusive on the
# water but the per-facility geocoding + reverse-geocode admin filter
# clips facilities to actual PHL territory.
bbox: [116.9, 4.6, 126.6, 21.1]

# Demo focus region — Metro Manila. Population center + most facility
# density in the country. Easy to grok for first-time visitors. The full
# country expands automatically in 3D / "All states" views.
focus_region:
  name: "Metro Manila"
  bbox: [120.9, 14.4, 121.2, 14.8]

population:
  total_millions: 117
  under_18_share: 0.32   # PSA Philippine Statistics Authority 2020 census
  under_5_share: 0.10

sources:
  healthsites: true
  osm_schools: true
  open_meteo: true
  air_quality: true
  worldpop: false

scoring_weights:
  # Country-specific overrides, same methodology as NGA + BGD + GTM + KEN:
  # the dominant hazard gets 0.30, fragility stays at 0.05 (v0.2 weakest
  # signal universally).
  #
  # Philippines is THE typhoon-and-flood country: 20+ tropical cyclones
  # per year (NOAA), the highest per-capita climate-disaster exposure on
  # earth (German Watch Global Climate Risk Index). Coastal communities
  # face the additional compounding from sea-level rise (Manila has been
  # sinking 10 cm/yr from groundwater extraction + climate). So flood
  # dominates — same logic as Bangladesh.
  #
  # Heat is meaningful but secondary — Metro Manila heat index regularly
  # exceeds 40°C in dry season but most of the country is moderated by
  # ocean proximity (unlike Sub-Saharan inland heat).
  #
  # PM2.5 in Metro Manila averages 14-18 µg/m³ (4× WHO guideline) but
  # rural air is generally clean. Lower than NGA's universal Sahel-dust
  # exposure, so 0.15.
  #
  # Drought matters but is El-Niño-cyclical rather than chronic; 0.10.
  heat_exposure: 0.20
  air_pollution: 0.15
  flood_risk: 0.30
  drought_risk: 0.10
  child_density: 0.20   # +0.05 over global default — higher under-18 share weight
  facility_fragility: 0.05
