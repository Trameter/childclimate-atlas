# Guatemala — country configuration
country:
  iso3: GTM
  iso2: GT
  name: Guatemala
  capital: Guatemala City

bbox: [-92.3, 13.7, -88.2, 17.9]

focus_region:
  name: "Guatemala City Metro"
  bbox: [-90.7, 14.5, -90.4, 14.8]

population:
  total_millions: 18
  under_18_share: 0.41
  under_5_share: 0.11

sources:
  healthsites: true
  osm_schools: true
  open_meteo: true
  air_quality: true
  worldpop: false

scoring_weights:
  # Country-specific overrides, methodologically consistent with NGA + BGD:
  # each country lifts its dominant hazard to 0.30 and lowers the weakest
  # signal (facility_fragility, v0.2 OSM-tag heuristic) to 0.05.
  #
  # For Guatemala the dominant hazard is heat in the Pacific lowlands —
  # facilities in Suchitepéquez, Escuintla, and Santa Rosa post heat-index
  # days of 250-270/yr (mirroring the Sahel argument for NGA's 0.30). The
  # original 0.20 left these maxed-on-heat schools capped at ~72 and out of
  # the SEVERE band even with extreme drought + PM2.5 stacked on top.
  # Drought stays high (0.20) — the Dry Corridor is GTM-specific and a
  # documented driver of child malnutrition. Air drops to 0.15 because PM2.5
  # is real but more variable here than in NGA Kano/Lagos.
  heat_exposure: 0.30
  air_pollution: 0.15
  flood_risk: 0.15
  drought_risk: 0.20
  child_density: 0.15
  facility_fragility: 0.05
